{% extends "frontend/base.html" %}
{% load static %}

{% block content %}
<div class="Auth">
    <div class="wrapper">
        <h3 class="sign-in">Вход</h3>
        <form id="signInForm">
            <input class="user-input" type="text" name="login" id="login" placeholder="Логин" required/>
            <input type="password" name="password" id="password" placeholder="Пароль" required/>
            <input type="submit" value="Войти"/>
            <a class="sub-link" href="/sign-up">Регистрация</a>
        </form>
    </div>
</div>
{% endblock %}
