{% extends "frontend/base.html" %}
{% load static %}

{% block content %}
<div class="Auth">
    <div class="wrapper">
        <h3 class="sign-up">Регистрация</h3>
        <form id="signUpForm">
            <input class="user-input" type="text" name="name" id="name" placeholder="Имя" required/>
            <input class="user-input" type="text" name="username" id="username" placeholder="Логин" required/>
            <input type="password" name="password" id="password" placeholder="Пароль" required/>
            <input type="submit" value="Создать аккаунт"/>
            <a class="sub-link" href="/sign-in">Войти</a>
        </form>
    </div>
</div>
{% endblock %}
